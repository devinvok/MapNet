name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python agents_demo.py
      - run: python compare.py
      # end-to-end real-test pipeline on the sample company, no models needed
      - run: python -m realtest.run --corpus examples/company --questions realtest/questions/sample-company.json --retrieval-only --data realtest/data
